<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
<h1>ToDoリスト</h1>
<form action="/add" method="POST">
    <input type="text" name="todo" placeholder="やること">
    <button type="submit">追加</button>
</form>
<ul>
    {% for todo in todos %}
    <li>
        {% if todo.completed %}
            <s>{{ todo.content }}</s>
        {% else %}
            {{ todo.content }}
        {% endif %}
        - {{ todo.created_at.strftime('%Y-%m-%d %H:%M') }}

        <a href="/complete/{{ todo.id }}">
            {% if todo.completed %}
                戻す
            {% else %}
                完了
            {% endif %}
        </a>

        <a href="/delete/{{ todo.id }}">削除する</a>
    </li>
    {%endfor%}
</ul>
</body>
</html>
